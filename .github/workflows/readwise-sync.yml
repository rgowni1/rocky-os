name: Morning Readwise Sync

on:
  schedule:
    # 17:20 UTC, twenty minutes behind the Oura sync. Both push to the same
    # Notion journal page, on disjoint properties; staggering keeps the logs
    # readable and avoids two jobs patching that page at once.
    #
    # Moved from 06:20 UTC with Oura: highlights are bucketed by Pacific
    # calendar date, so an evening-Pacific run closed the day before the
    # evening's reading happened.
    - cron: '20 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readwise-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync Readwise → Supabase → Notion
        env:
          READWISE_API_TOKEN: ${{ secrets.READWISE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          KANBAN_USER_ID: ${{ secrets.KANBAN_USER_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python readwise_sync.py

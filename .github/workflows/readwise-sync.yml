name: Nightly Readwise Sync

on:
  schedule:
    # 06:20 UTC, twenty minutes behind the Oura nightly. Both write
    # weekly_metrics, on disjoint columns, but staggering keeps the logs
    # readable and avoids two jobs patching the same Notion page at once.
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readwise-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync Readwise → Supabase → weekly_metrics / Notion
        env:
          READWISE_API_TOKEN: ${{ secrets.READWISE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          KANBAN_USER_ID: ${{ secrets.KANBAN_USER_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python readwise_sync.py

name: Morning Oura Sync

on:
  schedule:
    # 17:00 UTC = 10:00 Pacific (09:00 once DST ends — cron is fixed UTC).
    #
    # This used to be 06:00 UTC, which is 23:00 Pacific the *previous evening*:
    # the job ran before the night it was meant to collect, so the current week
    # never had a sleep row and every Oura card read "Pending" until the week
    # was a day old. Running mid-morning means last night is already in Oura.
    - cron: '0 17 * * *'
  workflow_dispatch:      # Allows manual run

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        env:
          # Oura → Supabase (source of truth)
          OURA_ACCESS_TOKEN: ${{ secrets.OURA_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          KANBAN_USER_ID: ${{ secrets.KANBAN_USER_ID }}
          # Consumers of Supabase
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          READWISE_API_TOKEN: ${{ secrets.READWISE_API_TOKEN }}
        run: python oura.py

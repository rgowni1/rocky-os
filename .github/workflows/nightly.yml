name: Nightly Oura Sync

on:
  schedule:
    - cron: '0 6 * * *'  # 6:00 AM UTC
  workflow_dispatch:      # Allows manual run

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        env:
          # Oura → Supabase (source of truth)
          OURA_ACCESS_TOKEN: ${{ secrets.OURA_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          KANBAN_USER_ID: ${{ secrets.KANBAN_USER_ID }}
          # Consumers of Supabase
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          READWISE_API_TOKEN: ${{ secrets.READWISE_API_TOKEN }}
        run: python oura.py

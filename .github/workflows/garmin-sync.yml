name: Garmin Sync

# Replaces the launchd job that ran on Rocky's Mac
# (com.rockygowni.garmin-sync). That needed the machine awake, and when launchd
# fired it on a maintenance wake the network was not up yet — two runs died
# outright and one took 30 minutes.
#
# The iMessage summary does not come along: osascript needs macOS with an Apple
# ID signed in, which a runner does not have. The summary is printed to the job
# log instead.

on:
  # Schedules disabled 2026-11-05. Garmin rate-limits the runner: egress
  # 52.252.244.221 (Azure), Cloudflare in front, and the MCP server gets
  # "Request failed with status code 429" on every call. The same token works
  # from a residential IP seconds later, so this is not auth.
  #
  # GitHub runners share Azure ranges with the whole platform, so Garmin sees
  # the aggregate and throttles the range -- two runs a day was never going to
  # be the deciding factor, and there is no amount of backing off that fixes it
  # from our side.
  #
  # The launchd job on the Mac (com.rockygowni.garmin-sync, 06:10 and 22:30
  # Pacific) is the live path and has kept Supabase current throughout.
  #
  # workflow_dispatch is kept so this can be re-tested occasionally -- if the
  # throttle is transient, re-enable the two crons below.
  #
  # 2026-11-12, first run from rocky-os: SUCCEEDED. No 429 anywhere. Fetched 14
  # daily rows, 2 sleep nights, 17 activities and 1470 session samples, upserted
  # all of it, and wrote 13 properties to Notion. So the throttle is at least
  # not permanent.
  #
  # Still not re-enabling on one green run -- a range-level throttle that
  # cleared once can come back, and the launchd job on the Mac has been covering
  # this the whole time. Dispatch it manually a few more times; if it keeps
  # passing, uncomment the crons and retire com.rockygowni.garmin-sync. Writes
  # are idempotent upserts, so the overlap during a trial period is harmless.
  workflow_dispatch:
  # schedule:
  #   - cron: '12 14 * * *'
  #   - cron: '32 6 * * *'

permissions:
  contents: read

concurrency:
  # Both schedules write the same rows. Overlap would be harmless (every write
  # is an idempotent upsert) but serialising keeps the logs readable.
  group: garmin-sync
  cancel-in-progress: false

jobs:
  garmin-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The vendored MCP server is ESM and needs Node 20+.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The vendored bundle keeps its deps external, so it cannot run without
      # them — this is not an optional optimisation.
      - name: Install MCP server dependencies
        run: npm ci --prefix sync/vendor/garmin-mcp --no-audit --no-fund

      - name: Restore Garmin OAuth tokens
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: |
          if [ -z "$GARMIN_TOKENS" ]; then
            echo "::error::GARMIN_TOKENS secret is empty"; exit 1
          fi
          mkdir -p "$HOME/.garmin-mcp"
          printf '%s' "$GARMIN_TOKENS" > "$HOME/.garmin-mcp/tokens.json"
          chmod 600 "$HOME/.garmin-mcp/tokens.json"
          python3 -c "import json,os; d=json.load(open(os.path.expanduser('~/.garmin-mcp/tokens.json'))); assert d.get('oauth1',{}).get('oauth_token'), 'no oauth1 token'; print('tokens restored, oauth1 present')"

      - name: Sync Garmin → Supabase → Notion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Writes go through PostgREST RPCs with this key. The Management API
          # PAT is deliberately absent: it expired twice in eight days and took
          # the scheduled run down with it each time.
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_JOURNAL_DB_ID: ${{ secrets.NOTION_JOURNAL_DB_ID }}
          # No .env on a runner; the values above are the source.
          GARMIN_ENV_FILE: /nonexistent
          GARMIN_MCP_TOKEN_DIR: /home/runner/.garmin-mcp
        run: python3 sync/garmin_sync.py

      # The OAuth1 token lasts ~1 year, but if Garmin ever invalidates it the
      # only fix is `npm run setup` locally with the password and an MFA code —
      # which cannot happen on a runner. Say so loudly rather than letting the
      # job fail silently every morning.
      - name: Explain an auth failure
        if: failure()
        run: |
          echo "::warning::If this failed on Garmin auth, the OAuth1 token has expired or been revoked."
          echo "Re-run setup on the Mac, then update the GARMIN_TOKENS secret:"
          echo "  cd ~/garmin-connect-mcp"
          echo "  read -rs \"pw?Garmin password: \" && GARMIN_EMAIL='...' GARMIN_PASSWORD=\"\$pw\" npm run setup; unset pw"
          echo "  gh secret set GARMIN_TOKENS -R rgowni1/rocky-os < ~/.garmin-mcp/tokens.json"

name: Garmin Diagnose

# One-off probe. garmin-sync started failing on 2026-11-04 with every call
# returning nothing in the same second, while the identical token works from a
# residential IP. This distinguishes the possibilities: auth rejected (401),
# datacenter IP blocked (403 / 429 / Cloudflare interstitial), or something
# else entirely. Delete once the cause is known.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --prefix vendor/garmin-mcp --no-audit --no-fund

      - name: Runner egress IP
        run: curl -s --max-time 20 https://api.ipify.org || echo "(ipify unreachable)"

      - name: Raw reachability of Garmin hosts
        run: |
          for h in sso.garmin.com connectapi.garmin.com connect.garmin.com; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 25 "https://$h/" || echo "curl-failed")
            echo "--- https://$h/ -> $code"
            head -c 200 /tmp/body 2>/dev/null | tr -d '\0'; echo
          done

      - name: Authenticated API call, status only
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: |
          mkdir -p "$HOME/.garmin-mcp"
          printf '%s' "$GARMIN_TOKENS" > "$HOME/.garmin-mcp/tokens.json"
          node -e '
            const fs=require("fs");
            const t=JSON.parse(fs.readFileSync(process.env.HOME+"/.garmin-mcp/tokens.json","utf8"));
            const tok=t.oauth2&&t.oauth2.access_token;
            console.log("oauth1 present:", !!(t.oauth1&&t.oauth1.oauth_token));
            console.log("oauth2 present:", !!tok, "expires_at:", t.oauth2&&t.oauth2.expires_at,
                        "now:", Math.floor(Date.now()/1000));
            if(!tok) return;
            fetch("https://connectapi.garmin.com/usersummary-service/usersummary/daily/9211dffb-3a5b-4be2-86b6-30bfa95d3147?calendarDate=2026-11-03",
              {headers:{Authorization:"Bearer "+tok,"User-Agent":"com.garmin.android.apps.connectmobile"}})
              .then(async r=>{
                console.log("GET usersummary ->", r.status, r.statusText);
                for (const k of ["cf-ray","server","x-ratelimit-remaining","retry-after","content-type"])
                  if (r.headers.get(k)) console.log("  "+k+":", r.headers.get(k));
                console.log("  body:", (await r.text()).slice(0,300));
              })
              .catch(e=>console.log("fetch threw:", e.message));
          '

      - name: MCP server stderr
        env:
          GARMIN_MCP_TOKEN_DIR: /home/runner/.garmin-mcp
        run: |
          # garmin_sync.py sends the server's stderr to DEVNULL, which is why the
          # failing runs showed no reason. Surface it here.
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"d","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_daily_summary","arguments":{"date":"2026-11-03"}}}' \
            | node vendor/garmin-mcp/index.js 2>&1 | head -40
